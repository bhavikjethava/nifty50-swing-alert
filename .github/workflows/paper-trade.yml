name: Daily Paper Trade

# Paper-trading cron for the Nifty50 swing strategy.
# Runs once each weekday after Indian market close (15:30 IST = 10:00 UTC).
# Scans fresh technicals, runs one paper-trading cycle, and commits the updated
# SQLite DB back so trade history persists across runs.
on:
  schedule:
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the committed DB.
concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: "file:./dev.db"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install (not ci) so the Linux runner resolves platform-specific optional
      # deps even if the lockfile was generated on a different OS.
      - run: npm install --no-audit --no-fund

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Scan technicals
        run: npm run scan:technicals
        continue-on-error: true # rate limits shouldn't fail the whole run

      - name: Run paper-trading cycle
        run: npm run paper-trade

      - name: Send any pending alerts
        run: npm run send-alerts
        continue-on-error: true

      - name: Persist database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/dev.db
          git diff --staged --quiet || git commit -m "chore: paper-trade run $(date -u +%Y-%m-%d)"
          git push
