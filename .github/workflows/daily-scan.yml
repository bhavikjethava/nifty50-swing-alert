name: Daily Scan & Alert

# News + technicals scan and alerting cron for the Nifty50 swing strategy.
# Runs once each weekday after Indian market close (15:30 IST = 10:00 UTC),
# staggered after the paper-trade job to avoid racing on the committed DB.
# Commits the updated SQLite DB back so scan history persists across runs.
on:
  schedule:
    - cron: "20 10 * * 1-5"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the committed DB.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: "file:./dev.db"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install (not ci) so the Linux runner resolves platform-specific optional
      # deps even if the lockfile was generated on a different OS.
      - run: npm install --no-audit --no-fund

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Scan news
        run: npm run scan:news
        continue-on-error: true # source flakiness shouldn't fail the whole run

      - name: Scan technicals
        run: npm run scan:technicals
        continue-on-error: true # rate limits shouldn't fail the whole run

      - name: Send any pending alerts
        run: npm run send-alerts
        continue-on-error: true

      - name: Persist database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/dev.db
          git diff --staged --quiet && exit 0
          git commit -m "chore: daily scan $(date -u +%Y-%m-%d)"
          # dev.db is binary and cannot be merged, so never rebase it. Instead,
          # last-writer-wins: if the push is rejected because another scan job
          # pushed first, re-point HEAD at the new remote tip while KEEPING our
          # freshly-written DB (git reset --soft preserves the working tree),
          # re-commit, and retry. This can't lose a scan's data to a conflict.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push attempt $attempt rejected; re-basing our DB onto the new remote tip"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add prisma/dev.db
            git diff --staged --quiet && exit 0
            git commit -m "chore: daily scan $(date -u +%Y-%m-%d)"
            sleep 3
          done
          echo "::error::failed to persist DB after 5 attempts" && exit 1
